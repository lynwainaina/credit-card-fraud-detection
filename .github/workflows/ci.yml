name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 8 */5 * *'

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_dev.txt
          pip install -e .

      - name: Run tests
        run: pytest tests/ -v
        env: 
            REQUIRED_SCHEMA: ${{ secrets.REQUIRED_SCHEMA }}
            TARGET_COL: ${{ secrets.TARGET_COL }}
            NUMERIC_BOUNDS: ${{ secrets.NUMERIC_BOUNDS }}
            IMBALANCE_WARN_THRESHOLD: ${{ secrets.IMBALANCE_WARN_THRESHOLD }}
            NULL_CRITICAL_THRESHOLD: ${{ secrets.NULL_CRITICAL_THRESHOLD }}
            NULL_WARN_THRESHOLD: ${{ secrets.NULL_WARN_THRESHOLD }}
            TOP_SIGNAL: ${{ secrets.TOP_SIGNAL }}
            FEATURES_FILE: ${{ secrets.FEATURES_FILE }}
            N_TRIALS: ${{ secrets.N_TRIALS }}
            CV_FOLDS: ${{ secrets.CV_FOLDS }}
            MLFLOW_EXPERIMENT: ${{ secrets.MLFLOW_EXPERIMENT }}

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff==0.11.13

      - name: Run ruff
        run: ruff check src/ app/

  keep-alive:
    name: Keep Streamlit App Alive
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'

    steps:
      - name: Ping Streamlit app
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${{ secrets.STREAMLIT_APP_URL }}")
          echo "Streamlit ping status: $STATUS"
